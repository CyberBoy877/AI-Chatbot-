<!DOCTYPE html>
<html>
<head>
  <title>TECHNITIOUS AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0a0a14;
      color: white;
      text-align: center;
      padding-top: 60px;
    }

    h1 {
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff;
    }

    input {
      padding: 12px;
      width: 260px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(90deg,#00ffff,#7c3aed);
      color: white;
      font-weight: bold;
      margin-left: 10px;
    }

    #chat {
      max-width: 600px;
      margin: 30px auto;
      text-align: left;
      background: rgba(255,255,255,0.05);
      padding: 15px;
      border-radius: 12px;
      min-height: 120px;
    }
  </style>
</head>

<body>

<h1>TECHNITIOUS AI</h1>
<p>Created by Cyberboy877</p>

<input id="input" type="text" placeholder="Ask something..." />
<button onclick="send()">Send</button>

<div id="chat"></div>

<script>
const API_KEY = "AQ.Ab8RN6IKA8FHOcehC9jmjXa3RZc64Md0v_icAQHB9UQjx-UNiA"
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const message = input.value;
  if (!message) return;

  chat.innerHTML += "<p><b>You:</b> " + message + "</p>";
  input.value = "";

  const response = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: message }] }]
      })
    }
  );

  const data = await response.json();

  const reply =
    data?.candidates?.[0]?.content?.parts?.[0]?.text ||
    "No response";

  chat.innerHTML += "<p><b>AI:</b> " + reply + "</p>";
}
</script>

</body>
</html>
