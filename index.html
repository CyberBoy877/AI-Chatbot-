<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBER AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

body::before{
content:"";
position:absolute;
width:500px;
height:500px;
background:#00ffff;
filter:blur(200px);
opacity:.15;
top:-100px;
left:-100px;
}

body::after{
content:"";
position:absolute;
width:500px;
height:500px;
background:#7c3aed;
filter:blur(200px);
opacity:.15;
bottom:-100px;
right:-100px;
}

.container{
width:95%;
max-width:900px;
height:85vh;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
border-radius:30px;
padding:20px;
display:flex;
flex-direction:column;
box-shadow:0 0 50px rgba(0,255,255,.1);
position:relative;
z-index:10;
}

.logo{
text-align:center;
font-size:2.8rem;
font-weight:bold;
margin-bottom:15px;
background:linear-gradient(90deg,#00ffff,#7c3aed,#00ff99);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
text-align:center;
opacity:.7;
margin-bottom:20px;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
border-radius:20px;
background:rgba(0,0,0,0.25);
}

.message{
margin:10px 0;
padding:12px;
border-radius:15px;
line-height:1.5;
}

.user{
background:rgba(0,255,255,.15);
border:1px solid rgba(0,255,255,.3);
}

.ai{
background:rgba(124,58,237,.15);
border:1px solid rgba(124,58,237,.3);
}

.bottom{
display:flex;
gap:10px;
margin-top:15px;
}

input{
flex:1;
padding:15px;
border:none;
border-radius:15px;
background:rgba(255,255,255,.08);
color:white;
font-size:16px;
outline:none;
}

button{
padding:15px 25px;
border:none;
border-radius:15px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#00ffff,#7c3aed);
color:white;
}

button:hover{
transform:scale(1.03);
}

.footer{
text-align:center;
margin-top:10px;
font-size:.8rem;
opacity:.5;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">CYBER AI</div>

<div class="subtitle">
The Future of Artificial Intelligence
</div>

<div id="chat">

<div class="message ai">
👋 Welcome to CYBER AI
</div>

</div>

<div class="bottom">

<input
id="message"
placeholder="Ask anything..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

<div class="footer">
Powered by CyberBoy877
</div>

</div>

<script>

async function sendMessage(){

const input=document.getElementById("message");
const chat=document.getElementById("chat");

const text=input.value;

if(!text) return;

chat.innerHTML+=`
<div class="message user">
${text}
</div>
`;

input.value="";

chat.innerHTML+=`
<div class="message ai">
AI response will appear here...
</div>
`;

chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
