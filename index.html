<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZYNTRA AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
height:100vh;
overflow:hidden;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 15% 20%, rgba(0,255,255,.15), transparent 30%),
radial-gradient(circle at 85% 25%, rgba(124,58,237,.15), transparent 30%),
radial-gradient(circle at 50% 90%, rgba(0,255,153,.12), transparent 30%);
animation:floatbg 12s ease-in-out infinite alternate;
}

@keyframes floatbg{
from{transform:scale(1) rotate(0deg);}
to{transform:scale(1.15) rotate(8deg);}
}

.app{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
max-width:1000px;
margin:auto;
padding:20px;
}

.header{
text-align:center;
padding:10px;
}

.logo{
font-size:3rem;
font-weight:900;
background:linear-gradient(90deg,#00ffff,#7c3aed,#00ff99);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tagline{
opacity:.7;
margin-top:8px;
}

.chat{
flex:1;
margin-top:20px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:20px;
overflow-y:auto;
}

.message{
padding:14px;
border-radius:16px;
margin-bottom:12px;
line-height:1.5;
}

.ai{
background:rgba(124,58,237,.18);
border:1px solid rgba(124,58,237,.25);
}

.user{
background:rgba(0,255,255,.12);
border:1px solid rgba(0,255,255,.25);
}

.inputbar{
display:flex;
gap:10px;
margin-top:15px;
}

input{
flex:1;
padding:16px;
border:none;
border-radius:16px;
background:rgba(255,255,255,.08);
color:white;
font-size:16px;
outline:none;
}

button{
padding:16px 22px;
border:none;
border-radius:16px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#00ffff,#7c3aed);
color:white;
}

button:hover{
transform:translateY(-2px);
}

.stats{
display:flex;
justify-content:center;
gap:15px;
margin-top:15px;
flex-wrap:wrap;
}

.card{
padding:12px 18px;
border-radius:14px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
}

.footer{
text-align:center;
opacity:.6;
margin-top:10px;
font-size:.85rem;
}

.pulse{
display:inline-block;
width:10px;
height:10px;
background:#00ff99;
border-radius:50%;
margin-right:6px;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.6);}
100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="app">

<div class="header">
<div class="logo">ZYNTRA AI</div>
<div class="tagline">
Next Generation Artificial Intelligence
</div>
</div>

<div class="stats">
<div class="card">⚡ Fast</div>
<div class="card">🧠 Smart</div>
<div class="card">🌍 Global</div>
<div class="card">🚀 Future Ready</div>
</div>

<div id="chat" class="chat">

<div class="message ai">
<span class="pulse"></span>
Welcome to ZYNTRA AI.
Ask anything and start exploring.
</div>

</div>

<div class="inputbar">
<input
id="message"
placeholder="Ask ZYNTRA AI anything..."
>
<button onclick="sendMessage()">
Send
</button>
</div>

<div class="footer">
Built by CyberBoy877
</div>

</div>

<script>

function sendMessage(){

const input=document.getElementById("message");
const chat=document.getElementById("chat");

const text=input.value.trim();

if(text==="") return;

chat.innerHTML += `
<div class="message user">${text}</div>
`;

chat.innerHTML += `
<div class="message ai">
AI integration will be connected here later.
</div>
`;

input.value="";

chat.scrollTop=chat.scrollHeight;
}

document.getElementById("message")
.addEventListener("keypress",function(e){
if(e.key==="Enter"){
sendMessage();
}
});

</script>

</body>
</html>
